[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "download-robot-logs"
version = "0.1.0"
description = "Download a SEER Robokit debug package from Robod."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
download-robot-logs = "download_robot_logs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
